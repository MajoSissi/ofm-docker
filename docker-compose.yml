# Our Free Model — 容器内独立服务
#
# 只发布 LAN 中继端口。普通服务端口按上游设计只绑回环，根本无法从容器外访问，
# 详见 README.md 的「端口，以及那个无法发布的端口」一节。
#
# OFM_LAN_PORT 在这里固定为 18901，让对外映射端口和中继自身端口是同一个号。
# 若该固定端口已被占用，服务不会因此退出：上游会降级为 `relayError`（在摘要
# 接口和 CLI 里都能看到），本地推理照常工作，只是 `-p` 转发不到东西而已。

services:
  our-free-model:
    image: ghcr.io/${IMAGE_NAMESPACE:-owner}/dsh-our-free-model:latest
    container_name: ofm
    restart: unless-stopped
    # 特意只绑 127.0.0.1：谁拿到 LAN Key，谁就能从本机出口用这些免费车道；
    # 绑到 0.0.0.0 等于把它送给所有能路由到这台机器的人。
    ports:
      - "127.0.0.1:18901:18901"
    # 数组写法：和 `environment` 的映射写法等价，但每行一个、行内自带注释，
    # 不容易在改动时把相邻两行并成一行。
    environment:
      - OFM_HOME=/data
      # 回环监听，永不对外发布
      - OFM_PORT=18900
      # 中继端口，唯一能从容器外访问的入口
      - OFM_LAN_PORT=18901
      # 置 0 可关闭启动刷新（离线 / CI），账号渠道任务不受影响
      - OFM_ENABLE_REFRESH=1
    volumes:
      # 服务记住的一切：设置、API Key、LAN Key、模型目录缓存、账号渠道、用量
      # 统计。丢掉这个卷，等于丢掉 LAN Key 和所有已配置渠道。
      - ofm-data:/data
    healthcheck:
      # /health 由回环监听应答，容器自己总能访问到，所以这个探针有效，
      # 也不可能被宿主网络上无关的进程满足。
      test:
        - CMD
        - node
        - -e
        - |
          const p = process.env.OFM_PORT || 18900
          require('http').get({ host: '127.0.0.1', port: p, path: '/health' },
            r => process.exit(r.statusCode === 200 ? 0 : 1)
          ).on('error', () => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      # LAN Key 只在首次启动时打印一次，日志就是运维读取它的地方。
      # 别把日志送去公开的日志收集端。
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ofm-data:
