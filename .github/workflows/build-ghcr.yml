# Our Free Model — build the container and push it to GHCR.
#
# Two triggers, as required:
#   * schedule: a daily run that re-pulls upstream and rebuilds if anything moved
#   * workflow_dispatch: a manual button in the Actions tab
#
# The workflow is deliberately *thin*: it does not decide what upstream contains
# or how the image is built. Those decisions live in the Dockerfile, which pins
# and records the upstream commit it was cut from. That separation keeps the
# workflow stable while upstream evolves under it.
#
# Platform is linux/amd64 only, per the deployment target. If arm64 is ever
# wanted, add it to the `platforms` input of docker/build-push-action below and
# note that upstream ships no arm64 artifacts — the build is from source, so it
# would work, just slower.

name: Build & push to GHCR

on:
  schedule:
    # 02:00 UTC daily = 10:00 Asia/Shanghai. Staggered so it does not land on
    # the hour, when GitHub's scheduler is most congested.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Upstream ref to build (branch, tag or commit SHA)'
        required: false
        default: 'main'
      push:
        description: 'Push the image to GHCR (uncheck to do a dry build only)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      # Only rebuild on changes that could actually affect the image, so a
      # README typo does not cost a build.
      - '.github/workflows/build-ghcr.yml'
      - 'Dockerfile'
      - 'docker/**'
      - 'docker-compose.yml'
      - 'README.md'
  pull_request:
    paths:
      - '.github/workflows/build-ghcr.yml'
      - 'Dockerfile'
      - 'docker/**'
      - 'docker-compose.yml'

concurrency:
  # A scheduled run must not queue behind an in-flight PR build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  resolve:
    # Resolve the upstream ref to an immutable SHA once, up front, so every
    # later job builds the exact same tree and GHCR records what was built.
    runs-on: ubuntu-latest
    outputs:
      upstream_repo: ${{ steps.resolve.outputs.repo }}
      upstream_ref: ${{ steps.resolve.outputs.ref }}
      upstream_sha: ${{ steps.resolve.outputs.sha }}
      upstream_version: ${{ steps.resolve.outputs.version }}
      image: ${{ steps.lower.outputs.image }}
    steps:
      - name: Resolve upstream ref to a commit SHA
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.upstream_ref || 'main' }}
        run: |
          set -euo pipefail
          repo="${{ vars.UPSTREAM_REPO || 'Ebony-Vinyl/dsh-our-free-model' }}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          sha=$(gh api "repos/$repo/commits/$REF" --jq '.sha')
          if [ -z "$sha" ] || [ "$sha" = "null" ]; then
            echo "::error::could not resolve $repo@$REF" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Read the version out of the same tree the build will fetch, so the
          # image's `version` label can never disagree with the code inside it.
          # `set -o pipefail` is already on, so a failed `gh api` fails the job
          # instead of silently producing an empty label.
          version=$(gh api "repos/$repo/contents/package.json?ref=$sha" --jq '.content' \
            | base64 -d \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const doc=s.trim()?JSON.parse(s):null;process.stdout.write(doc&&typeof doc.version==="string"?doc.version:"")})')
          if [ -z "$version" ]; then
            echo "::warning::could not read a version from $repo@$REF package.json; the image label will be empty"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "resolved $repo@$REF = $sha (version ${version:-unknown})"

      - name: Lowercase the image path
        id: lower
        run: |
          # GHCR image references must be all-lowercase; `github.repository`
          # inherits the owner's casing, which may not be.
          #
          # This is also where the package name is decided, and it is worth being
          # explicit about it: GHCR names a package after the LAST segment of the
          # image path. Pushing to ghcr.io/<owner>/<repo> therefore creates a
          # package called <repo> — here `ofm-docker` — and NOT the upstream
          # project's name (`dsh-our-free-model`). Pulling the project name gets
          # `manifest unknown` on a package that is fine. Everything downstream
          # (the verify job's pull, the prune step's package lookup, the docs)
          # must use this same path.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image: ghcr.io/${GITHUB_REPOSITORY,,}"
          # The package name for the GHCR versions API, derived rather than
          # hardcoded, so a fork publishes and prunes its own package.
          echo "package=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"
          echo "package: ${GITHUB_REPOSITORY##*/}"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record build metadata
        id: meta
        env:
          UPSTREAM_SHA: ${{ needs.resolve.outputs.upstream_sha }}
          VERSION: ${{ needs.resolve.outputs.upstream_version }}
        run: |
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        # Skipped on pull_request and on a dry manual run — an unauthenticated
        # build is still a valid smoke test.
        if: >-
          github.event_name != 'pull_request' && (
            github.event_name != 'workflow_dispatch' ||
            inputs.push
          )
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN is enough for GHCR when `packages: write` is granted
          # above. No PAT is required for the token to push here.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.resolve.outputs.image }}
          # One tag: `latest`. Every dated/sha tag was removed deliberately —
          # the requirement is that the registry hold a single rolling image, and
          # a dated tag left behind is a second image that never goes away.
          #
          # `flavor: latest=false` disables metadata-action's own automatic tag
          # generation (its `latest=auto` would derive one from a tag push), so
          # the `type=raw` line below is the only thing that produces a tag — and
          # it only does so on the default branch, so a PR or a feature branch
          # never publishes anything.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=dsh-our-free-model
            org.opencontainers.image.vendor=Ebony-Vinyl
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' &&
                    (github.event_name != 'workflow_dispatch' || inputs.push) }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            UPSTREAM_REPO=${{ needs.resolve.outputs.upstream_repo }}
            UPSTREAM_REF=${{ needs.resolve.outputs.upstream_ref }}
            UPSTREAM_SHA=${{ needs.resolve.outputs.upstream_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
            VCS_URL=${{ github.repository }}
            VERSION=${{ steps.meta.outputs.upstream_version }}
          # GHA layer cache keeps the nightly run cheap even though nothing
          # usually changed upstream.
          cache-from: type=gha,scope=ghcr-${{ github.ref_name }}
          cache-to: type=gha,scope=ghcr-${{ github.ref_name }},mode=max

      - name: Delete every version except the newest
        # This is the other half of "only one image in the registry", and without
        # it the tag change above is cosmetic: GHCR keeps an *untagged* immutable
        # version for every push that overwrote `latest`. Nothing in the UI names
        # them, so they accumulate silently and there is no retention setting that
        # clears them. The versions must be deleted explicitly.
        #
        # Runs as a separate step rather than a shell call inside the build,
        # because it must not run on a pull_request or a dry dispatch, and because
        # it must run AFTER the push — so the version just created is the one kept.
        if: >-
          github.event_name != 'pull_request' && (
            github.event_name != 'workflow_dispatch' ||
            inputs.push
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.resolve.outputs.image }}
          KEEP_TAG: latest
        run: |
          set -euo pipefail
          image="$IMAGE"
          # The GHCR package name is the final component of the image reference,
          # lowercased. `needs.resolve.outputs.image` is already
          # `ghcr.io/<lowercased owner/repo>`, so taking the last segment is
          # enough. Deriving it from the image — rather than from
          # `github.event.repository.name` — matters because `event.repository`
          # is null on a `schedule` trigger, which is precisely the run this step
          # exists for; that would give an empty name and a call to
          # /user/packages/container//versions.
          package="${image##*/}"
          package="${package,,}"
          if [ -z "$package" ]; then
            echo "::error::cannot derive the package name from IMAGE=$image" >&2
            exit 1
          fi
          echo "pruning versions of package '$package' (image $image)"

          # Which version to keep is decided by TAG, never by position.
          #
          # The first version of this step sorted by id descending and deleted
          # everything but row 1. That is wrong twice over: GHCR version ids are
          # opaque integers with no documented ordering, so "highest id == newest"
          # is a guess; and the one version that matters is the one carrying the
          # `latest` tag, which is exactly the version that must survive. Deleting
          # it leaves `latest` pointing at nothing, and the verify job then fails
          # with `manifest unknown` — a message that names no cause, because the
          # push and the deletion both "succeeded".
          gh api -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${package}/versions" --paginate \
            --jq '.[] | [.id, (.metadata.container.tags // [] | join(","))] | @tsv' \
            > /tmp/versions.tsv

          total=$(wc -l < /tmp/versions.tsv)
          echo "registry holds $total version(s)"

          # The version carrying KEEP_TAG is the one to preserve.
          keep_id=$(awk -F'\t' -v want="$KEEP_TAG" \
            'BEGIN{FS="\t"} { n=split($2, a, ","); for (i=1;i<=n;i++) if (a[i]==want) { print $1; exit } }' \
            /tmp/versions.tsv)
          if [ -z "$keep_id" ]; then
            # Nothing is tagged. That is a broken state, not a cleanup opportunity:
            # if we started deleting now we could remove the only copy.
            echo "::error::no version carries the '$KEEP_TAG' tag — refusing to prune, because the publish is broken" >&2
            awk -F'\t' '{print "  id="$1" tags="$2}' /tmp/versions.tsv
            exit 1
          fi
          echo "keeping version $keep_id (tagged '$KEEP_TAG')"

          deleted=0
          failed=0
          while IFS=$'\t' read -r id tags; do
            [ -n "$id" ] || continue
            [ "$id" = "$keep_id" ] && continue
            # Belt and braces: never delete a version that still carries ANY tag,
            # even if it is not the one we are keeping. A tagged version is one
            # somebody may be pulling deliberately.
            if [ -n "$tags" ]; then
              echo "::warning::version $id is tagged ($tags) — leaving it alone; only untagged versions are pruned"
              failed=$((failed + 1))
              continue
            fi
            if gh api -X DELETE -H "Accept: application/vnd.github+json" \
                 "/user/packages/container/${package}/versions/$id" >/dev/null 2>&1; then
              deleted=$((deleted + 1))
              echo "deleted version $id"
            else
              failed=$((failed + 1))
              # A deletion that fails must not fail the build: losing a green run
              # to a cleanup step is worse than one stale version surviving.
              echo "::warning::could not delete version $id (already gone, or not deletable)"
            fi
          done < /tmp/versions.tsv
          echo "pruned $deleted version(s), kept 1 ($KEEP_TAG); $failed left in place"

      - name: Record what was published
        run: |
          {
            echo "### Published"
            echo ""
            echo "- image: \`${{ needs.resolve.outputs.image }}:latest\`"
            echo "- digest: \`${{ steps.tags.outputs.digest }}\`"
            echo "- upstream: \`${{ needs.resolve.outputs.upstream_repo }}@${{ needs.resolve.outputs.upstream_sha }}\`"
            echo ""
            echo "Only \`latest\` is kept; every older version was deleted after the push."
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    # A nightly build that starts but crashes is worse than no build: it burns a
    # slot in the registry and lies to whoever pulls `latest`. This job starts
    # the freshly pushed image and proves it actually serves a model list, then
    # fails the run loudly.
    needs: [resolve, build]
    if: >-
      github.event_name != 'pull_request' && (
        github.event_name != 'workflow_dispatch' || inputs.push
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Pull the image just pushed
        run: docker pull ${{ needs.resolve.outputs.image }}:latest

      - name: Start the container
        run: |
          # No -p: nothing outside is exposed on purpose. The LAN relay port is
          # discovered at runtime; see the README.
          docker run -d --name ofm-verify \
            -e OFM_HOME=/data \
            -v ofm-verify-data:/data \
            --rm "${{ needs.resolve.outputs.image }}:latest"

          # `docker run -d` returns as soon as the container *starts*, not when
          # it is *running*. A container whose ENTRYPOINT cannot execute — a
          # missing exec bit on the entrypoint script is the case that actually
          # happened — exits in milliseconds, and the failure only shows up at
          # the NEXT step as `No such container: ofm-verify`, which names no
          # cause at all. So assert liveness here, and dump the log if it died.
          # Without this the error below is actively misleading.
          alive=false
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' ofm-verify 2>/dev/null || echo "gone")
            case "$state" in
              running*) alive=true; break ;;
              "exited "*|"created "*|"dead "*)
                echo "::error::the container is not running — state is '$state'"
                echo "--- container log ---"
                docker logs ofm-verify 2>&1 | tail -40 || true
                echo "--- image entrypoint ---"
                docker inspect -f '{{json .Config.Entrypoint}}' "${{ needs.resolve.outputs.image }}:latest"
                exit 1
                ;;
            esac
            sleep 1
          done
          if [ "$alive" != true ]; then
            echo "::error::the container never reached a running state"
            echo "--- container log ---"
            docker logs ofm-verify 2>&1 | tail -40 || true
            exit 1
          fi
          echo "container is running; waiting for the service to write its settings..."
          for i in $(seq 1 60); do
            if docker exec ofm-verify sh -c 'test -f "$OFM_HOME/settings.json"' 2>/dev/null; then
              echo "settings.json present after ${i} checks"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the service never wrote $OFM_HOME/settings.json"
          echo "--- container log ---"
          docker logs ofm-verify 2>&1 | tail -40 || true
          exit 1

      - name: Assert /health answers on the loopback listener
        run: |
          # The local listener is loopback-only, so this must be exec'd inside
          # the container, exactly as an operator would.
          docker exec ofm-verify \
            node -e 'const p=process.env.OFM_PORT||18900;require("http").get({host:"127.0.0.1",port:p,path:"/health"},r=>{let d="";r.setEncoding("utf8");r.on("data",c=>d+=c);r.on("end",()=>{console.log("status",r.statusCode);console.log(d);process.exit(r.statusCode===200?0:1)})}).on("error",e=>{console.error(e.message);process.exit(1)})'

      - name: Assert the LAN relay is reachable and correctly gated
        run: |
          # The relay binds 0.0.0.0, so a published port reaches it — but this
          # job publishes nothing on purpose. It execs in and checks the relay
          # exists, is bound, and enforces its own key.
          #
          # The relay's *live* port is not the one in settings.json. Upstream
          # persists `standaloneLanPort` as the *requested* value, and when that
          # is 0 — the default, meaning "pick a free port" — the service binds an
          # ephemeral one and leaves 0 on disk. Reading the port from
          # settings.json therefore connects to nothing (verified: 0 is not
          # listening while the real port is, here, 51972). Ask the running
          # service for its relay state instead: `/api/management/summary` is
          # loopback-only, which this exec is, and reports `lan.port`.
          set -euo pipefail
          docker exec -e OFM_LAN_CHECK=1 ofm-verify node /dev/stdin <<'EOF'
          import fs from 'node:fs'
          import http from 'node:http'

          const home = process.env.OFM_HOME || '/data'
          const settings = JSON.parse(fs.readFileSync(home + '/settings.json', 'utf8'))
          const localKey = settings.forwardKey

          const ask = (port, path, key) => new Promise(resolve => {
            const req = http.request(
              { host: '127.0.0.1', port, path, headers: key ? { Authorization: `Bearer ${key}` } : {} },
              r => { let body = ''; r.setEncoding('utf8'); r.on('data', c => { body += c }); r.on('end', () => resolve({ status: r.statusCode, body })) },
            )
            req.on('error', e => resolve({ status: String(e.code || e.message), body: '' }))
            req.end()
          })
          const fail = message => { console.error('::error::' + message); process.exit(1) }

          // 1. The local listener must be up and healthy on loopback.
          const localPort = settings.standalonePort
          if (!localPort) fail('settings.json has no standalonePort — the service never bound')
          const health = await ask(localPort, '/health', null)
          if (health.status !== 200) fail(`local /health -> ${health.status}, expected 200`)
          console.log(`local  /health        -> 200  (127.0.0.1:${localPort})`)

          // 2. Ask the service where its relay actually is, rather than trusting
          //    the persisted (requested) port.
          const summary = await ask(localPort, '/api/management/summary', localKey)
          if (summary.status !== 200) fail(`/api/management/summary -> ${summary.status}, expected 200`)
          let relayPort = 0
          try { relayPort = JSON.parse(summary.body).lan.port ?? 0 } catch { /* handled below */ }
          if (!relayPort) fail('the relay is not running (lan.port missing from the summary)')
          console.log(`relay is listening on ${relayPort} (from /api/management/summary)`)

          // 3. The two keys must exist and must differ — the LAN key is separate
          //    precisely so it can be rotated without touching the local one.
          if (!settings.standaloneLanKey) fail('no LAN key was generated in ' + home + '/settings.json')
          if (settings.standaloneLanKey === localKey) {
            fail('the LAN key and the local forwardKey are identical — they must be separate')
          }
          console.log(`keys differ: lan=${settings.standaloneLanKey.length} chars, local=${localKey.length} chars`)

          // 4. The relay enforces the LAN key and the local key does not work on it.
          const anon = await ask(relayPort, '/v1/models', null)
          if (anon.status !== 401) fail(`anonymous /v1/models -> ${anon.status}, expected 401`)
          console.log('anonymous /v1/models -> 401')
          const keyed = await ask(relayPort, '/v1/models', settings.standaloneLanKey)
          if (keyed.status !== 200) fail(`keyed /v1/models -> ${keyed.status}, expected 200`)
          console.log('keyed     /v1/models -> 200')
          const wrong = await ask(relayPort, '/v1/models', localKey)
          if (wrong.status !== 401) fail(`local key on the relay -> ${wrong.status}, expected 401 (keys must be separate)`)
          console.log('local key /v1/models -> 401 (key separation enforced)')

          // 5. The relay carries inference routes only.
          const mgmt = await ask(relayPort, '/health', settings.standaloneLanKey)
          if (mgmt.status !== 404) fail(`relay /health -> ${mgmt.status}, expected 404`)
          console.log('relay     /health      -> 404 (inference routes only)')
          console.log('LAN relay contract verified')
          EOF
        env:
          # Re-assert here rather than relying on the container-wide env, so the
          # check fails if the entrypoint ever stops exporting what it documents.
          OFM_HOME: /data

      - name: Print the management hint for the run log
        if: always()
        run: |
          echo "### Image verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- image: \`${{ needs.resolve.outputs.image }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- upstream: \`${{ needs.resolve.outputs.upstream_repo }}@${{ needs.resolve.outputs.upstream_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The management page is loopback-only **by design** (upstream refuses to bind a routable address)." >> "$GITHUB_STEP_SUMMARY"
          echo "To open it: \`docker exec -it <container> sh\`, then read the management URL printed at startup." >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f ofm-verify 2>/dev/null || true
          docker volume rm ofm-verify-data 2>/dev/null || true

  summary:
    needs: [resolve, build, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write run summary
        run: |
          {
            echo "### Build & push run"
            echo ""
            echo "| job | result |"
            echo "|---|---|"
            echo "| resolve | ${{ needs.resolve.result }} |"
            echo "| build | ${{ needs.build.result }} |"
            echo "| verify | ${{ needs.verify.result }} |"
            echo ""
            echo "Image: \`${{ needs.resolve.outputs.image }}:latest\`"
            echo ""
            echo "Upstream: \`${{ needs.resolve.outputs.upstream_repo }}@${{ needs.resolve.outputs.upstream_sha }}\` (version ${{ needs.resolve.outputs.upstream_version }})"
          } >> "$GITHUB_STEP_SUMMARY"
